<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Royal Forest Green -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a4d40" />
      <stop offset="55%" stop-color="#0e3128" />
      <stop offset="100%" stop-color="#061713" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2d1" />
      <stop offset="25%" stop-color="#e8c784" />
      <stop offset="60%" stop-color="#c5a46d" />
      <stop offset="100%" stop-color="#8a6933" />
    </linearGradient>

    <!-- Gold Accent / Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf1cd" />
      <stop offset="35%" stop-color="#c5a46d" />
      <stop offset="70%" stop-color="#e0be7d" />
      <stop offset="100%" stop-color="#7a5823" />
    </linearGradient>

    <!-- Soft Drop Shadow for Scale Elements -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Medallion / Crest -->
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#bgGlow)" stroke="url(#goldBorder)" stroke-width="2.2" />

  <!-- Inner Delicate Ring -->
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="url(#goldBorder)" stroke-width="0.75" stroke-opacity="0.55" stroke-dasharray="2.5 1.5" />

  <!-- Scales of Justice Group -->
  <g filter="url(#subtleShadow)">
    <!-- Central Finial / Spearhead Tip -->
    <path d="M32 9 L34.5 13.5 L32 15 L29.5 13.5 Z" fill="url(#goldSheen)" />
    <circle cx="32" cy="15" r="2" fill="url(#goldSheen)" />

    <!-- Center Pillar / Column -->
    <path d="M30.7 16 H33.3 V44 H30.7 Z" fill="url(#goldSheen)" />
    <path d="M29.5 24 H34.5 V26 H29.5 Z" fill="url(#goldSheen)" />

    <!-- Pillar Base / Pedestal -->
    <path d="M26.5 44 H37.5 V46.5 H26.5 Z" fill="url(#goldSheen)" />
    <path d="M22 47 H42 V50.5 C42 51.5 41 52 40 52 H24 C23 52 22 51.5 22 50.5 Z" fill="url(#goldSheen)" />

    <!-- Horizontal Balance Beam -->
    <path d="M32 18 C37 18 43 19 49 21.5 C49.5 21.7 49.5 22.3 49 22.5 C43 21 37 20 32 20 C27 20 21 21 15 22.5 C14.5 22.3 14.5 21.7 15 21.5 C21 19 27 18 32 18 Z" fill="url(#goldSheen)" />

    <!-- Left Pivot and Scale -->
    <circle cx="15.5" cy="22" r="1.6" fill="url(#goldSheen)" />
    <!-- Left Suspension Chains -->
    <line x1="15.5" y1="23.2" x2="10" y2="33.5" stroke="url(#goldSheen)" stroke-width="1.1" stroke-linecap="round" />
    <line x1="15.5" y1="23.2" x2="21" y2="33.5" stroke="url(#goldSheen)" stroke-width="1.1" stroke-linecap="round" />
    <!-- Left Pan Bowl -->
    <path d="M8.5 33.5 H22.5 C22.5 37.5 19.5 39.5 15.5 39.5 C11.5 39.5 8.5 37.5 8.5 33.5 Z" fill="url(#goldSheen)" />

    <!-- Right Pivot and Scale -->
    <circle cx="48.5" cy="22" r="1.6" fill="url(#goldSheen)" />
    <!-- Right Suspension Chains -->
    <line x1="48.5" y1="23.2" x2="43" y2="33.5" stroke="url(#goldSheen)" stroke-width="1.1" stroke-linecap="round" />
    <line x1="48.5" y1="23.2" x2="54" y2="33.5" stroke="url(#goldSheen)" stroke-width="1.1" stroke-linecap="round" />
    <!-- Right Pan Bowl -->
    <path d="M41.5 33.5 H55.5 C55.5 37.5 52.5 39.5 48.5 39.5 C44.5 39.5 41.5 37.5 41.5 33.5 Z" fill="url(#goldSheen)" />
  </g>
</svg>